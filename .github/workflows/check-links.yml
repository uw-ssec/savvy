name: Check external links

# External URLs in Markdown, checked with lychee (config: lychee.toml).
# Relative links are checked on every PR by `pixi run plugins-check` in
# validate-plugins.yml. This workflow stays off PRs: third-party sites go down
# and rate-limit, so a PR could fail for reasons its author didn't cause.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      # Also listed explicitly so edits in the hidden .agents/ directory always
      # trigger a run (links-check passes --hidden to lychee).
      - '.agents/**'
      - 'lychee.toml'
      - '.github/workflows/check-links.yml'
  schedule:
    - cron: '17 7 * * 1' # weekly, Monday 07:17 UTC
  workflow_dispatch:

permissions: {}

# Push, schedule and manual runs on main all share one group. Don't cancel the
# running one: its result says which commit, or which week, broke a link. A new
# run waits for it instead of overlapping (GitHub keeps at most one waiting run
# per group, so a burst of merges is checked by the latest one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.82.0
          environments: ci
          locked: true

      # Results younger than max_cache_age (lychee.toml) are reused, so a
      # re-run doesn't hit every site again.
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check links
        env:
          # Authenticated requests get GitHub's higher rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          pixi run links-check --format markdown --output "$RUNNER_TEMP/lychee.md"
          status=$?
          set -e
          cat "$RUNNER_TEMP/lychee.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/lychee.md" # TEMP: print report to the log; revert before merge
          if [ "$status" -ne 0 ]; then
            echo "::error::Broken external links; see the job summary. Fix the URL, or add it to the exclude list in lychee.toml with a reason."
          fi
          exit "$status"
