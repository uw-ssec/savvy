# Metadata for docs/catalog.md that SKILL.md frontmatter doesn't carry.
#
# docs/catalog.md is generated from this file plus every SKILL.md, command, and
# agent. After editing either, run `pixi run catalog-sync` and commit both files.
# CI (`pixi run catalog-check`) fails if a skill has no example prompt, a plugin
# has no tier or maintainer, or docs/catalog.md is out of date.
#
# For each plugin:
#   tier:        one of the keys under `tiers`.
#   maintainer:  GitHub handle or team that owns the plugin's skills
#                (@uw-ssec/engineering for SSEC plugins, the contributor for
#                contributed ones). A skill can override it with its own
#                `maintainer:`.
#   skills.<name>.example:
#                a prompt a user would type that should activate the skill.
#                Before adding one, check that it does: run
#                `pixi run -e ci python evals/catalog-triggers/trigger_test.py <plugin>/<skill>`
#                (or try it in Claude Code with the plugin loaded).
#   skills.<name>.activates:
#                set to false when no reasonable prompt activated the skill in
#                testing. The catalog then flags the row. Fix the skill's
#                description and remove the flag, rather than leaving it.
#   skills.<name>.issue:
#                required with `activates: false`: the issue number that tracks
#                fixing the skill's description. The flagged row links to it.

tiers:
  Core: >-
    Maintained by SSEC and useful across research software projects in any field.
    Held to the full release, CI, and security standards.
  Community: >-
    Built for a specific scientific field or tool ecosystem, or contributed from
    outside SSEC. Reviewed on entry and must pass CI. Domain plugins were folded
    into this tier (see #136).

plugins:
  # --- Core ------------------------------------------------------------------

  scientific-python-development:
    tier: Core
    maintainer: "@uw-ssec/engineering"
    skills:
      code-quality-tools:
        example: Set up ruff, mypy, and pre-commit hooks for a scientific Python package, with the config in pyproject.toml.
      pixi-package-manager:
        example: Set up a pixi.toml for a new scientific Python project that mixes conda-forge and PyPI packages, with a test task and a lockfile for Linux and macOS.
      python-packaging:
        example: Create a pyproject.toml with a src layout and Hatchling for a new scientific Python package that I'll publish to PyPI.
      python-testing:
        example: I need to organize tests for a scientific Python package. What's a good pytest layout with shared fixtures, parametrization, and property-based testing?
      scientific-documentation:
        example: Set up Sphinx docs with NumPy-style docstrings for a scientific Python package and configure it to build on Read the Docs.

  ai-research-workflows:
    tier: Core
    maintainer: "@uw-ssec/engineering"
    skills:
      creating-handoffs:
        example: Create a handoff document so the next session can pick up this work where we left off.
      ensuring-reproducibility:
        example: 'Make this analysis reproducible: capture provenance and pin the environment for the result.'
      hardening-research-code:
        example: 'Harden this research code: check it''s numerically correct and add regression tests against known results.'
      implementing-plans:
        example: Implement the plan in docs/rse/specs/plan-regridding.md.
      iterating-plans:
        example: Update the implementation plan to add a phase for GPU support based on the experiment results.
      planning-implementations:
        example: Create an implementation plan for adding NetCDF export to a Python package.
      researching:
        example: 'Survey prior art: what tools or libraries exist for regridding climate model output, and has this been done before?'
      running-experiments:
        example: I'm not sure whether Numba or Cython is better for this hot loop. Prototype both approaches head-to-head and compare them before we commit to a design.
      using-research-workflows:
        example: 'I''m starting a new feature in a research codebase. Guide me through the research workflow: which skill should I use, and where do I start?'
      validating-implementations:
        example: Validate the implementation against its plan before I open a PR.

  project-management:
    tier: Core
    maintainer: "@uw-ssec/engineering"
    skills:
      community-health-files:
        example: Create CONTRIBUTING, CODE_OF_CONDUCT, SECURITY, and CITATION.cff files and GitHub issue templates for a new open-source research project.
      documentation-validation:
        example: Check my docs for broken links and set up prose linting with Vale in CI.

  containerization:
    tier: Core
    maintainer: "@uw-ssec/engineering"
    skills:
      compose-orchestration:
        example: 'Help me with Docker Compose: set up a multi-container local dev stack for a web API, Postgres, and a Jupyter service, with service dependencies and health checks.'
      container-registries:
        example: Set up a GitHub Actions workflow that builds a multi-architecture image and pushes it to GHCR with version tags.
      container-security:
        example: Scan our Docker image for vulnerabilities, triage the findings, then generate an SBOM and sign the image with cosign.
      devcontainers:
        example: 'Configure a dev container for this repository: a devcontainer.json with features and lifecycle hooks so it works in GitHub Codespaces.'
      dockerfile-patterns:
        example: What's the best way to optimize a Dockerfile for a Python app? Explain multi-stage builds, layer caching, and base image selection, with an example.
        activates: false
        issue: 168
      gpu-containers:
        example: 'Configure a Docker container environment for a GPU workload: CUDA passthrough for PyTorch, and validate multi-GPU access.'
      podman:
        example: Migrate a Docker workflow to rootless Podman and run the service with a Quadlet systemd unit.
      singularity-apptainer:
        example: How do I run containers on an HPC cluster with Apptainer? Convert our Docker image for the cluster and run it under Slurm.

  supply-chain-security:
    tier: Core
    maintainer: "@uw-ssec/engineering"
    skills:
      supply-chain-dependency-security:
        example: Evaluate a new dependency for addition to our pyproject.toml. Review it and our lockfile for maintainer-account-takeover style supply-chain attacks.
      supply-chain-ecosystem-quirks:
        example: What Rust-specific supply-chain gotchas should I check in Cargo.toml and .cargo/config.toml?
      supply-chain-hardened-ci-cd:
        example: 'Write a hardened GitHub Actions release workflow (.github/workflows/release.yml) for a Python package: SHA-pinned actions, a two-job build/publish split, OIDC trusted publishing, and deny-by-default permissions.'
      supply-chain-incident-response:
        example: 'The tj-actions/changed-files GitHub Action was compromised and our CI used it last week. Walk me through the incident-response runbook: lockfile check, CI cache check, secret rotation, persistence hunt.'
      supply-chain-sbom-provenance:
        example: Our release workflow publishes to PyPI. What SLSA level does it reach, and how do we add SBOM generation and provenance attestations?
      supply-chain-threat-awareness:
        example: Which active 2025-2026 supply chain campaigns (Shai-Hulud, TeamPCP, the axios compromise) should a Python and npm research project worry about, and what patterns do CVE scanners miss?

  research-software-design:
    tier: Core
    maintainer: "@uw-ssec/engineering"
    skills:
      user-persona-discovery:
        example: Help me create personas for the users of a climate data portal. Who are my users?

  # --- Community ---------------------------------------------------------------

