# Accepted SkillEvaluator high/critical findings for the skill trust pilot.
# Each entry is a mapping with: skill (repo-relative skill dir), check_name,
# file_path (relative to the skill dir), line_content (the scanner's reported
# snippet: may be multi-line and truncated, copy it exactly from the report),
# file_sha256 (SHA-256 of the whole flagged file, so any edit to that file
# needs re-review; compute with `shasum -a 256 <skill>/<file_path>`), and
# reason (why the finding is safe). An entry that stops matching a finding or
# whose file changed fails the gate. CODEOWNERS reviews every change to this file.
