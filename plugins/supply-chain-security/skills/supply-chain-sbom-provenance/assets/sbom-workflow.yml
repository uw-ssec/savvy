# SBOM, build provenance and Sigstore signatures for a Python release.
#
# Copy to .github/workflows/ and adapt the build step to your project. On each
# published GitHub Release it:
#   1. builds the sdist and wheel in a job with a read-only token;
#   2. installs the wheel into a clean venv and scans that venv with syft
#      (syft finds no dependencies when pointed at dist/ or at the wheel);
#   3. attests build provenance for every file (GitHub attestation API);
#   4. signs every file with cosign keyless, writing <file>.sigstore.json;
#   5. uploads the files, SBOM, SHA256SUMS and bundles to the release.
#
# Actions are pinned to full commit SHAs. Re-resolve them when you copy this
# file; the supply-chain-hardened-ci-cd skill covers pinning.

name: sbom-and-provenance

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir dist/

      - name: Install the wheel into a clean venv for scanning
        # --only-binary keeps dependency build scripts from running in the job
        # that produces dist/; --without-pip keeps pip itself out of the SBOM.
        run: |
          python -m venv --without-pip sbom-env
          python -m pip --python sbom-env/bin/python install --only-binary :all: dist/*.whl

      - name: Generate CycloneDX SBOM with syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: sbom-env/
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-artifact
          path: dist/
          if-no-files-found: error

  attest-and-sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # OIDC token for Sigstore
      attestations: write   # GitHub attestation API
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifact
          path: dist/

      - name: Record digests
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'dist/*'

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Sign every file with cosign keyless
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done

      - name: Upload files, SBOM, digests and bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/*
