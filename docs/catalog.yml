      compression-codecs:
        example: 'Configure compression for float32 Zarr arrays: choose between Blosc with Zstd and plain Zstd, and add a Quantize filter.'
      data-migration:
        example: 'We''re migrating scientific datasets: convert our HDF5 and NetCDF files to Zarr, or use VirtualiZarr or kerchunk to make virtual stores.'
      zarr-fundamentals:
        example: I'm new to Zarr. Explain how chunked, compressed N-dimensional arrays work in zarr-python, with an example of creating an array in a group.
      zarr-xarray-integration:
        example: Write an xarray to_zarr pipeline that uses append_dim for daily files and region writes for backfills, with encoding set so the Dask chunks align with the Zarr chunks.
        activates: false
        issue: 219

  zarr-chunk-optimization:
    tier: Community
    maintainer: "@uw-ssec/engineering"
    skills:
      access-pattern-analysis:
        example: Our users say "I make maps" and "I need time series". Turn that into weighted access patterns before we benchmark Zarr chunking.
      chunking-strategy:
        example: What Zarr chunk sizing should I use? Help me choose chunk configurations for a scientific dataset on S3 based on its access patterns.
      performance-reporting:
        example: 'Turn these Zarr chunking benchmark results into a stakeholder report with ranked recommendations: (time=1, lat=720, lon=1440): map read 0.4 s, time-series read 38 s; (time=365, lat=90, lon=90): map 6.1 s, series 0.9 s; (time=30, lat=180, lon=360): map 1.2 s, series 4.5 s.'
        activates: false
        issue: 212
      rechunking:
        example: Write a Python script that rechunks a .zarr dataset on S3 from (1, 720, 1440) chunks to (30, 180, 360), with memory-bounded execution, progress reporting, and validation of the output.
        activates: false
        issue: 213
      synthetic-data:
        example: Write a Python script that generates a synthetic Zarr dataset with dimensions time=8760, lat=721, lon=1440 in float32 with Blosc compression, as a benchmark input for chunking tests.
        activates: false
        issue: 214

