        example: Explain how to do aperture photometry on a FITS image with AstroPy and photutils, including WCS coordinates and physical units.
        activates: false
        issue: 175
      xarray-for-multidimensional-data:
        example: 'Explain how to work with xarray datasets: multidimensional labeled arrays from NetCDF files, groupby over time, and Dask for data larger than memory.'

